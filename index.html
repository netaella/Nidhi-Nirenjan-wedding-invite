*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
html:not(.unlocked){overflow:hidden;height:100%}
body{background:var(--bg);min-height:100vh}
main{width:var(--W);margin:0 auto;padding:max(12px,calc((100vh - var(--AH))/2)) 0;filter:drop-shadow(0 1px 10px rgba(60,30,20,.12))}

.card{position:relative;width:var(--W);height:calc(var(--AH)*(1 - var(--ct) - var(--cb)));overflow:hidden}

.art{position:absolute;left:0;width:var(--W);height:var(--AH);top:calc(var(--AH)*var(--ct)*-1)}

@keyframes swc{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}

.stk line{stroke:#2c8c88;stroke-width:5.5;stroke-linecap:round}
.stk{transform-origin:420px 1297px;animation:tap .85s ease-in-out infinite;animation-play-state:paused}

@keyframes tap{0%,100%{transform:rotate(-13deg)}42%,52%{transform:rotate(0)}}

.env{position:absolute;inset:0;perspective:1800px;z-index:5;cursor:pointer}
.envbody{position:absolute;inset:0;transition:transform .9s cubic-bezier(.5,0,.75,.45) .22s;clip-path:inset(0)}

.env.opening .flap{transform:rotateX(180deg)}

.env.go .gar{animation:drop .85s cubic-bezier(.2,.9,.3,1) .1s backwards,swg 6.4s ease-in-out 1s infinite alternate}

.qr{position:absolute}
.card:not(.seen) .flw{display:none}
.art>.head{animation-play-state:paused}
.alive .art>.head{animation-play-state:running}

<script>(function(){
var root=document.documentElement,env=document.getElementById('env'),c1=document.getElementById('c1');
var opened=false,hintEl=document.getElementById('scrollhint');
c1.classList.add('hidden-card');
// envelope elements stay visible: they live inside .art but are not hidden by .hidden-card
var envEls=env.querySelectorAll('img,button,span');
function io(cb,opt){return 'IntersectionObserver' in window?new IntersectionObserver(cb,opt):null}
// Part 1: names/date fade in, then hint
window.addEventListener('load',function(){
  env.classList.add('go');
  setTimeout(function(){env.classList.add('ready')},250);
  setTimeout(function(){env.classList.add('hintOn')},1300);
});
// sway for envelope pieces from the start
env.classList.add('alive');
env.querySelectorAll('.spr').forEach(function(e){e.style.animationPlayState='running'});
function rowsOf(card){return Array.prototype.slice.call(card.querySelectorAll('.row'))}
function revealSeq(card,done){
  var rs=rowsOf(card);card.classList.add('seen');
  rs.forEach(function(r,i){setTimeout(function(){r.classList.add('on')},i*230)});
  setTimeout(function(){card.classList.add('alive');done&&done()},rs.length*230+900);
}
function open(){
  if(opened)return;opened=true;
  c1.classList.remove('hidden-card');
  env.classList.add('opening');
  setTimeout(function(){env.querySelector('.flap').classList.add('fade')},600);
  setTimeout(function(){revealSeq(c1,function(){
    env.classList.add('gone');
    root.classList.add('unlocked');
    initScrollCards();
    setTimeout(function(){hintEl.classList.add('show')},500);
  })},1150);
}
env.addEventListener('click',open);
env.querySelector('.flap').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
function initScrollCards(){
  ['c2','c3','c4'].forEach(function(id){
    var card=document.getElementById(id);
    var rs=rowsOf(card);
    var ro=io(function(es){
      var n=0;es.forEach(function(en){if(en.isIntersecting){var t=en.target;setTimeout(function(){t.classList.add('on')},n++*140);ro.unobserve(t)}});
    },{rootMargin:'0px 0px -10% 0px',threshold:.1});
    if(ro)rs.forEach(function(r){ro.observe(r)});else rs.forEach(function(r){r.classList.add('on')});
    var vo=io(function(es){es.forEach(function(en){card.classList.toggle('alive',en.isIntersecting);})},{rootMargin:'100px 0px'});
    var so=io(function(es){es.forEach(function(en){if(en.isIntersecting){card.classList.add('seen');so.unobserve(card)}})},{threshold:.3});if(so)so.observe(card);else card.classList.add('seen');
    if(vo)vo.observe(card);else card.classList.add('alive');
  });
  // pause card1 sways when offscreen
  var v1=io(function(es){es.forEach(function(en){c1.classList.toggle('alive',en.isIntersecting)})},{rootMargin:'100px 0px'});
  if(v1)v1.observe(c1);
  window.addEventListener('scroll',function(){if(window.scrollY>30)hintEl.classList.remove('show')},{passive:true});
}
})();
</script></body></html>
